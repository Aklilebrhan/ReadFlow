version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: readflow-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: readflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d readflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: readflow-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/readflow
      - ENVIRONMENT=production
      - AI_PROVIDER=mock
      - STORAGE_PROVIDER=local
      - LOCAL_STORAGE_PATH=/app/data/storage
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/data/storage

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: readflow-web
    restart: always
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  storage_data:
